<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>数据统计 · 小生物v2 管理面板</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🐾 小生物v2 管理面板<small>web_handler</small></div>
    <nav>
      <a href="/index.html">主页</a>
      <a href="/files.html">项目架构</a>
      <a href="/db.html">数据库管理</a>
      <a href="/stats.html">数据统计</a>
    </nav>
    <div class="spacer"></div>
    <span class="badge" id="onebot-badge">OneBot: 检测中…</span>
    <span class="user" id="top-user"></span>
    <button class="btn small" id="btn-logout">退出登录</button>
  </header>

  <main class="container">
    <h2 class="page-title">数据统计</h2>
    <p class="page-desc">
      统计由机器人实时采集（写入 data/db/stats.db）。频率 = 历史日均（总量 ÷ 统计天数，自首次记录起，不足 1 天按 1 天计）；
      群聊场景来自 get_group_list 轮询（计入接口下行）与消息事件，私聊场景自统计上线累计；
      "最常触发指令（不计插件）"为全部插件 + 内置指令的统一指令名排行。点击卡片查看 年/月/日/小时 粒度详情（折线图/文本）。每 10 秒自动刷新。
    </p>

    <div class="toolbar">
      <span class="fmeta" id="stat-time"></span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn ghost" id="btn-refresh">🔄 刷新</button>
    </div>

    <div id="stats-sections"><div class="empty-hint">加载中…</div></div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/stats.js"></script>
</body>
</html>

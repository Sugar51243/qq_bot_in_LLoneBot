<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title data-i18n="title.files">项目架构 · 小生物v2 管理面板</title>
  <link rel="stylesheet" href="/css/style.css?v=2">
  <script src="/js/i18n.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
</head>
<body>
  <header class="topbar">
    <button class="nav-burger" id="nav-burger" data-i18n-title="top.menu">☰</button>
    <div class="brand"><span data-i18n="brand.title">🐾 小生物v2 管理面板</span><small>web_handler</small></div>
    <nav id="top-nav">
      <a href="/index.html" data-i18n="nav.home">主页</a>
      <a href="/files.html" data-i18n="nav.files">项目架构</a>
      <a href="/db.html" data-i18n="nav.db">数据库管理</a>
      <a href="/stats.html" data-i18n="nav.stats">数据统计</a>
    </nav>
    <div class="spacer"></div>
    <span class="badge onebot-badge" id="onebot-badge" data-i18n="onebot.checking">OneBot: 检测中…</span>
    <span class="user top-user" id="top-user"></span>
    <span class="tb-tools"><span class="lang-slot"></span><span class="theme-slot"></span></span>
    <button class="btn small" id="btn-logout" data-i18n="top.logout">退出登录</button>
    <div class="mob-panel" id="mob-panel">
      <nav>
        <a href="/index.html" data-i18n="nav.home">主页</a>
        <a href="/files.html" data-i18n="nav.files">项目架构</a>
        <a href="/db.html" data-i18n="nav.db">数据库管理</a>
        <a href="/stats.html" data-i18n="nav.stats">数据统计</a>
      </nav>
      <div class="mob-row">
        <span class="badge onebot-badge" data-i18n="onebot.checking">OneBot: 检测中…</span>
        <span class="user top-user"></span>
      </div>
    </div>
  </header>

  <main class="container">
    <h2 class="page-title" data-i18n="nav.files">项目架构</h2>
    <p class="page-desc" data-i18n="files.desc">浏览与修改整个小生物v2项目文件夹（根目录：小生物v2）。代码文件可在线编辑保存；日志文件（.log）以只读模式实时跟踪查看；数据库文件（.db）点击"打开数据库"进入数据库管理页。</p>

    <div class="toolbar">
      <div class="breadcrumb" id="crumb"><a href="#" data-path="" data-i18n="files.root">项目根</a></div>
      <button class="btn" id="btn-up" data-i18n="files.up">⬆ 上一级</button>
      <button class="btn ghost" id="btn-refresh" data-i18n="common.refresh">🔄 刷新</button>
      <div class="spacer" style="flex:1"></div>
      <button class="btn" id="btn-mkdir" data-i18n="files.mkdir">📁 新建文件夹</button>
      <button class="btn" id="btn-newfile" data-i18n="files.newfile">📄 新建文件</button>
      <button class="btn primary" id="btn-upload" data-i18n="files.upload">⬆ 上传文件</button>
      <input type="file" id="file-input" multiple hidden>
    </div>

    <div class="file-table">
      <div class="frow head">
        <span data-i18n="files.thName">名称</span><span data-i18n="files.thSize">大小</span><span data-i18n="files.thMtime">修改时间</span><span style="text-align:right" data-i18n="common.actions">操作</span>
      </div>
      <div id="file-rows"></div>
    </div>
  </main>

  <script src="/js/common.js?v=2"></script>
  <script src="/js/files.js?v=2"></script>
</body>
</html>
